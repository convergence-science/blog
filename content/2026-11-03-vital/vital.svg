    <circle cx="601" cy="481" r="20"/>
    <circle cx="975" cy="481" r="20"/>
    <circle cx="1349" cy="481" r="20"/>
    <circle cx="1722" cy="481" r="20"/>

    <polygon points="186,548 209,548 229,610 249,548 272,548 241,638 217,638"/>
    <rect x="594" y="548" width="19" height="90"/>
    <polygon points="945,548 1018,548 1018,568 991,568 991,638 972,638 972,568 945,568"/>
    <polygon points="1327,598 1348,556 1368,556 1389,598 1369,598 1358,575 1347,598"/>
    <polygon points="1712,548 1731,548 1731,619 1768,619 1768,638 1712,638"/>
