    <polygon points="152,197 198,197 230,303 262,197 308,197 252,357 208,357"/>
    <rect x="326" y="197" width="38" height="160"/>
    <polygon points="382,197 508,197 508,235 464,235 464,357 426,357 426,235 382,235"/>
    <polygon points="655,197 693,197 693,320 750,320 750,357 655,357"/>
  </g>
  <polygon fill="#7b5fc7" points="527,272 559,197 593,197 625,272 591,272 576,236 561,272"/>

